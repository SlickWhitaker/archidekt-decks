name: Update Archidekt Decks

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create decks directory
        run: mkdir -p decks

      - name: Fetch Archidekt decks
        run: |
          set -e

          decks=(
            "25646654"
            "25646635"
            "25646611"
            "25646583"
            "25646532"
            "25646499"
            "25646467"
            "25646416"
            "25646394"
            "25646098"
            "25646062"
            "25646033"
            "25645985"
            "25645947"
            "25645835"
            "25645732"
            "25645631"
            "25645591"
            "25645511"
          )

          for deck_id in "${decks[@]}"; do
            echo "========================================"
            echo "Fetching deck ${deck_id}"
            echo "========================================"

            curl --fail --silent --show-error --location \
              -H "Accept: application/json" \
              -o "decks/${deck_id}.json" \
              "https://archidekt.com/api/decks/${deck_id}/"

            # Verify that Archidekt returned valid JSON.
            jq empty "decks/${deck_id}.json"

            echo "Successfully fetched ${deck_id}"
            echo "Size: $(wc -c < "decks/${deck_id}.json") bytes"
          done

      - name: Commit updated decks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add decks/

          if git diff --cached --quiet; then
            echo "No deck changes detected."
          else
            git commit -m "Update Archidekt decks"
            git push
          fi

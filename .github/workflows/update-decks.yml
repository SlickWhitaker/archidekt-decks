name: Update Archidekt Decks

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create decks directory
        run: |
          mkdir -p decks

      - name: Fetch Archidekt decks
        run: |
          decks=(
            "25646654"
            "25646635"
            "25646611"
            "25646583"
            "25646532"
            "25646499"
            "25646467"
            "25646416"
            "25646394"
            "25646098"
            "25646062"
            "25646033"
            "25645985"
            "25645947"
            "25645835"
            "25645732"
            "25645631"
            "25645591"
            "25645511"
          )

          failed=0

          for deck_id in "${decks[@]}"; do
            echo ""
            echo "========================================"
            echo "Fetching deck ${deck_id}"
            echo "========================================"

            http_code=$(curl \
              --silent \
              --show-error \
              --location \
              --output "decks/${deck_id}.json" \
              --write-out "%{http_code}" \
              -H "Accept: application/json" \
              "https://archidekt.com/api/decks/${deck_id}/")

            echo "HTTP status: ${http_code}"
            echo "Response size: $(wc -c < "decks/${deck_id}.json") bytes"

            if [ "${http_code}" != "200" ]; then
              echo "ERROR: HTTP ${http_code} for deck ${deck_id}"
              echo "Response:"
              head -c 1000 "decks/${deck_id}.json"
              echo ""
              failed=1
              continue
            fi

            if jq empty "decks/${deck_id}.json" >/dev/null 2>&1; then
              echo "SUCCESS: Valid JSON for ${deck_id}"
            else
              echo "ERROR: Invalid JSON for deck ${deck_id}"
              echo "Response:"
              head -c 1000 "decks/${deck_id}.json"
              echo ""
              failed=1
            fi
          done

          echo ""
          echo "========================================"
          echo "FETCH SUMMARY"
          echo "========================================"

          if [ "$failed" -ne 0 ]; then
            echo "One or more decks failed."
            exit 1
          fi

          echo "ALL DECKS SUCCESSFULLY FETCHED."

      - name: Commit updated decks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add decks/

          if git diff --cached --quiet; then
            echo "No deck changes detected."
          else
            git commit -m "Update Archidekt decks"
            git push
          fi

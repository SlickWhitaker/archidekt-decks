name: Update Archidekt Decks

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-decks.yml"
      - "scripts/build_slim_decks.py"

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-archidekt-decks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main


      # ============================================================
      # GIT CONFIGURATION
      # ============================================================

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # ============================================================
      # SYNCHRONIZE WITH LATEST MAIN
      # ============================================================

      - name: Synchronize with latest main
        run: |
          set -e

          git fetch origin main
          git checkout main
          git reset --hard origin/main


      # ============================================================
      # CREATE DIRECTORIES
      # ============================================================

      - name: Create deck directories
        run: |
          set -e

          mkdir -p decks
          mkdir -p decks-slim


      # ============================================================
      # DISCOVER ALL ARCHIDEKT DECKS
      #
      # Uses the Archidekt v3 deck listing endpoint.
      #
      # IMPORTANT:
      # Discovery failure stops the workflow instead of treating
      # an empty/invalid response as "the user has no decks".
      #
      # This prevents a temporary Archidekt outage from deleting
      # the entire GitHub mirror.
      # ============================================================

      - name: Discover Archidekt decks
        env:
          ARCHIDEKT_USERNAME: matthyzer
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DISCOVERING ARCHIDEKT DECKS"
          echo "========================================"

          rm -f /tmp/deck-ids.txt
          rm -f /tmp/deck-ids-clean.txt

          page=1
          page_size=100
          discovery_success=0

          while true; do

            echo ""
            echo "Fetching Archidekt deck page ${page}..."

            response_file="/tmp/archidekt-page-${page}.json"

            rm -f "$response_file"

            http_code=""

            for attempt in 1 2 3 4 5; do

              echo "Discovery attempt ${attempt}/5"

              http_code=$(curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout 20 \
                --max-time 90 \
                --retry 2 \
                --retry-delay 3 \
                --output "$response_file" \
                --write-out "%{http_code}" \
                -H "Accept: application/json" \
                -H "User-Agent: MTG-Analyzer-Archidekt-Sync/1.0" \
                "https://archidekt.com/api/decks/v3/?ownerUsername=${ARCHIDEKT_USERNAME}&deckFormat=3&orderBy=-createdAt&pageSize=${page_size}&page=${page}" \
                || true)

              echo "HTTP status: ${http_code}"

              if [ "${http_code}" = "200" ] \
                && [ -s "$response_file" ] \
                && jq empty "$response_file" >/dev/null 2>&1; then

                break
              fi

              if [ "${attempt}" -lt 5 ]; then
                sleep 5
              fi

            done


            # --------------------------------------------------------
            # Discovery failed.
            #
            # DO NOT continue.
            #
            # An invalid discovery response must never be interpreted
            # as an empty deck collection.
            # --------------------------------------------------------

            if [ "${http_code}" != "200" ] \
              || [ ! -s "$response_file" ] \
              || ! jq empty "$response_file" >/dev/null 2>&1; then

              echo ""
              echo "ERROR: Could not successfully query Archidekt."
              echo ""
              echo "HTTP status: ${http_code}"
              echo ""
              echo "Response:"
              cat "$response_file" 2>/dev/null || true
              echo ""

              echo "Existing GitHub deck copies will NOT be deleted."
              exit 1
            fi


            # --------------------------------------------------------
            # Extract deck records safely.
            #
            # Never recursively search for every .id field because
            # card records and unrelated objects may also contain IDs.
            # --------------------------------------------------------

            if jq -e 'type == "array"' "$response_file" >/dev/null 2>&1; then

              echo "API response format: array"

              jq -r '
                .[]
                | .id
                | select(type == "number" or type == "string")
              ' "$response_file" >> /tmp/deck-ids.txt

              count=$(jq 'length' "$response_file")


            elif jq -e '.results? | type == "array"' "$response_file" >/dev/null 2>&1; then

              echo "API response format: .results"

              jq -r '
                .results[]
                | .id
                | select(type == "number" or type == "string")
              ' "$response_file" >> /tmp/deck-ids.txt

              count=$(jq '.results | length' "$response_file")


            elif jq -e '.data? | type == "array"' "$response_file" >/dev/null 2>&1; then

              echo "API response format: .data"

              jq -r '
                .data[]
                | .id
                | select(type == "number" or type == "string")
              ' "$response_file" >> /tmp/deck-ids.txt

              count=$(jq '.data | length' "$response_file")


            elif jq -e '.results.data? | type == "array"' "$response_file" >/dev/null 2>&1; then

              echo "API response format: .results.data"

              jq -r '
                .results.data[]
                | .id
                | select(type == "number" or type == "string")
              ' "$response_file" >> /tmp/deck-ids.txt

              count=$(jq '.results.data | length' "$response_file")


            else

              echo ""
              echo "ERROR: Unknown Archidekt response format."
              echo ""

              jq '{
                type: type,
                keys: (
                  if type == "object"
                  then keys
                  else []
                  end
                )
              }' "$response_file"

              echo ""
              echo "Existing GitHub deck copies will NOT be deleted."
              exit 1

            fi


            echo "Deck records returned: ${count}"


            # --------------------------------------------------------
            # Pagination.
            # --------------------------------------------------------

            if [ "${count}" -lt "${page_size}" ]; then
              break
            fi

            page=$((page + 1))

            if [ "${page}" -gt 100 ]; then

              echo ""
              echo "ERROR: Pagination safety limit reached."
              exit 1

            fi

          done


          # ==========================================================
          # CLEAN AND DEDUPLICATE IDS
          # ==========================================================

          if [ ! -s /tmp/deck-ids.txt ]; then

            echo ""
            echo "ERROR: Archidekt returned zero deck IDs."
            echo ""
            echo "This is treated as a discovery failure."
            echo "Existing GitHub copies will NOT be deleted."

            exit 1

          fi


          grep -E '^[0-9]+$' /tmp/deck-ids.txt \
            | sort -n \
            | uniq \
            > /tmp/deck-ids-clean.txt


          deck_count=$(wc -l < /tmp/deck-ids-clean.txt)


          echo ""
          echo "========================================"
          echo "DISCOVERED DECK IDS"
          echo "========================================"

          cat /tmp/deck-ids-clean.txt

          echo ""
          echo "Total discovered decks: ${deck_count}"


          if [ "${deck_count}" -eq 0 ]; then

            echo ""
            echo "ERROR: No valid deck IDs were discovered."
            echo "Existing GitHub copies will NOT be deleted."

            exit 1

          fi


      # ============================================================
      # FETCH EVERY DISCOVERED DECK
      #
      # Each deck gets several attempts.
      #
      # If a refresh fails:
      #
      #   - Existing valid GitHub copy is preserved.
      #   - The workflow continues to refresh other decks.
      #
      # This is important because one broken Archidekt request should
      # never prevent all of the other decks from being synchronized.
      # ============================================================

      - name: Fetch Archidekt decks
        run: |
          set -euo pipefail

          failed=0
          refreshed=0
          preserved=0

          while IFS= read -r deck_id; do

            echo ""
            echo "========================================"
            echo "FETCHING DECK ${deck_id}"
            echo "========================================"

            final_file="decks/${deck_id}.json"
            tmp_file="decks/.${deck_id}.json.tmp"

            rm -f "$tmp_file"

            success=0


            # --------------------------------------------------------
            # Primary endpoint.
            # --------------------------------------------------------

            for attempt in 1 2 3 4 5; do

              echo ""
              echo "Attempt ${attempt}/5 for deck ${deck_id}"

              rm -f "$tmp_file"

              http_code=$(curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout 20 \
                --max-time 90 \
                --retry 2 \
                --retry-delay 3 \
                --output "$tmp_file" \
                --write-out "%{http_code}" \
                -H "Accept: application/json" \
                -H "User-Agent: MTG-Analyzer-Archidekt-Sync/1.0" \
                "https://archidekt.com/api/decks/${deck_id}/" \
                || true)

              response_size=$(wc -c < "$tmp_file" 2>/dev/null || echo 0)

              echo "HTTP status: ${http_code}"
              echo "Response size: ${response_size} bytes"


              if [ "${http_code}" = "200" ] \
                && [ -s "$tmp_file" ] \
                && jq empty "$tmp_file" >/dev/null 2>&1; then

                # ----------------------------------------------------
                # Verify this really is the requested deck.
                # ----------------------------------------------------

                returned_id=$(jq -r '.id // empty' "$tmp_file")

                if [ "${returned_id}" = "${deck_id}" ]; then

                  mv "$tmp_file" "$final_file"

                  echo ""
                  echo "SUCCESS: Deck ${deck_id} refreshed."

                  success=1
                  refreshed=$((refreshed + 1))

                  break

                else

                  echo ""
                  echo "WARNING: JSON was valid, but deck ID did not match."
                  echo "Expected: ${deck_id}"
                  echo "Received: ${returned_id}"

                fi

              fi


              if [ "${attempt}" -lt 5 ]; then
                sleep 5
              fi

            done


            rm -f "$tmp_file"


            # --------------------------------------------------------
            # If refresh failed, preserve existing valid copy.
            # --------------------------------------------------------

            if [ "${success}" -ne 1 ]; then

              echo ""
              echo "WARNING: Could not refresh deck ${deck_id}."

              if [ -f "$final_file" ] \
                && jq empty "$final_file" >/dev/null 2>&1; then

                echo "Existing valid GitHub copy will be preserved."

                preserved=$((preserved + 1))

              else

                echo "No valid existing copy is available."

                failed=1

              fi

            fi

          done < /tmp/deck-ids-clean.txt


          echo ""
          echo "========================================"
          echo "FETCH SUMMARY"
          echo "========================================"

          echo "Successfully refreshed: ${refreshed}"
          echo "Existing copies preserved: ${preserved}"
          echo "Unrecoverable failures: ${failed}"


          # If at least one discovered deck has no valid local copy,
          # fail the workflow. We never create a fake/incomplete deck.
          if [ "${failed}" -ne 0 ]; then

            echo ""
            echo "WARNING: One or more decks have no valid local copy."
            echo "The workflow will NOT delete stale decks."

          fi


      # ============================================================
      # VERIFY THE MIRROR
      #
      # Make sure every discovered deck has a valid JSON file.
      # ============================================================

      - name: Verify deck mirror
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING DECK MIRROR"
          echo "========================================"

          verification_failed=0

          while IFS= read -r deck_id; do

            file="decks/${deck_id}.json"

            if [ ! -f "$file" ]; then

              echo "ERROR: Missing deck file: ${file}"
              verification_failed=1
              continue

            fi


            if ! jq empty "$file" >/dev/null 2>&1; then

              echo "ERROR: Invalid JSON: ${file}"
              verification_failed=1
              continue

            fi


            returned_id=$(jq -r '.id // empty' "$file")

            if [ "${returned_id}" != "${deck_id}" ]; then

              echo "ERROR: Wrong deck ID in ${file}"
              echo "Expected: ${deck_id}"
              echo "Received: ${returned_id}"

              verification_failed=1
              continue

            fi


            echo "OK: ${deck_id}"

          done < /tmp/deck-ids-clean.txt


          if [ "${verification_failed}" -ne 0 ]; then

            echo ""
            echo "ERROR: Deck mirror verification failed."
            echo "Stale decks will NOT be removed."

            exit 1

          fi


          echo ""
          echo "All discovered decks have valid local copies."


      # ============================================================
      # REMOVE STALE DECK FILES
      #
      # ONLY happens after successful discovery AND successful
      # verification of every discovered deck.
      #
      # Therefore a temporary Archidekt outage cannot wipe the mirror.
      # ============================================================

      - name: Remove stale deck files
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CHECKING FOR STALE DECK FILES"
          echo "========================================"

          for file in decks/*.json; do

            [ -e "$file" ] || continue

            deck_id=$(basename "$file" .json)

            if ! grep -qx "$deck_id" /tmp/deck-ids-clean.txt; then

              echo "Removing stale deck: ${deck_id}"

              rm -f "$file"

            fi

          done


      # ============================================================
      # BUILD COMPACT ANALYSIS COPIES
      #
      # Produces:
      #
      #   decks-slim/{id}.meta.json
      #   decks-slim/{id}.names.txt
      #   decks-slim/{id}.cards.jsonl
      #   decks-slim/{id}.json
      #
      # These are the files the MTG analyzer can read efficiently.
      # ============================================================

      - name: Build compact analysis decks
        run: |
          set -euo pipefail

          python3 scripts/build_slim_decks.py


      # ============================================================
      # VERIFY COMPACT ANALYSIS COPIES
      # ============================================================

      - name: Verify compact analysis copies
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING COMPACT ANALYSIS DATA"
          echo "========================================"

          verification_failed=0

          while IFS= read -r deck_id; do

            meta="decks-slim/${deck_id}.meta.json"
            names="decks-slim/${deck_id}.names.txt"
            cards="decks-slim/${deck_id}.cards.jsonl"
            slim="decks-slim/${deck_id}.json"


            if [ ! -f "$meta" ]; then
              echo "ERROR: Missing ${meta}"
              verification_failed=1
            fi

            if [ ! -f "$names" ]; then
              echo "ERROR: Missing ${names}"
              verification_failed=1
            fi

            if [ ! -f "$cards" ]; then
              echo "ERROR: Missing ${cards}"
              verification_failed=1
            fi

            if [ ! -f "$slim" ]; then
              echo "ERROR: Missing ${slim}"
              verification_failed=1
            fi


            if [ -f "$meta" ] \
              && ! jq empty "$meta" >/dev/null 2>&1; then

              echo "ERROR: Invalid JSON: ${meta}"
              verification_failed=1

            fi


            if [ -f "$slim" ] \
              && ! jq empty "$slim" >/dev/null 2>&1; then

              echo "ERROR: Invalid JSON: ${slim}"
              verification_failed=1

            fi


            if [ -f "$meta" ]; then

              meta_id=$(jq -r '.id // empty' "$meta")

              if [ "${meta_id}" != "${deck_id}" ]; then

                echo "ERROR: Wrong ID in ${meta}"
                verification_failed=1

              fi

            fi


            echo "Verified analysis bundle: ${deck_id}"

          done < /tmp/deck-ids-clean.txt


          if [ "${verification_failed}" -ne 0 ]; then

            echo ""
            echo "ERROR: Compact analysis verification failed."
            exit 1

          fi


          echo ""
          echo "All compact analysis bundles verified."


      # ============================================================
      # COMMIT UPDATED DECKS
      # ============================================================

      - name: Commit updated decks
        run: |
          set -euo pipefail

          git add decks/
          git add decks-slim/
          git add scripts/build_slim_decks.py
          git add .github/workflows/update-decks.yml


          if git diff --cached --quiet; then

            echo "No deck changes detected."
            exit 0

          fi


          git commit \
            -m "Update Archidekt decks and analysis copies"


      # ============================================================
      # PUSH CHANGES
      # ============================================================

      - name: Push changes
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do

            echo ""
            echo "========================================"
            echo "PUSH ATTEMPT ${attempt}/3"
            echo "========================================"


            if git push origin main; then

              echo ""
              echo "Push successful."
              exit 0

            fi


            echo ""
            echo "Push was rejected."
            echo "Synchronizing with origin/main..."


            git fetch origin main


            if git rebase origin/main; then

              continue

            fi


            echo ""
            echo "Rebase failed."
            echo "Resetting to origin/main..."


            git rebase --abort || true

            git reset --hard origin/main


            # Rebuild the generated analysis files after reset.
            python3 scripts/build_slim_decks.py


            git add decks/
            git add decks-slim/
            git add scripts/build_slim_decks.py
            git add .github/workflows/update-decks.yml


            if ! git diff --cached --quiet; then

              git commit \
                -m "Update Archidekt decks and analysis copies"

            fi

          done


          echo ""
          echo "ERROR: Could not push after 3 attempts."
          exit 1

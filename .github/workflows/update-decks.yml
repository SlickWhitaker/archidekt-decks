name: Update Archidekt Decks

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Turtle Power
        run: |
          mkdir -p decks

          curl -L \
            -H "Accept: application/json" \
            -o decks/turtle-power.json \
            "https://archidekt.com/api/decks/22618311/"

      - name: Commit updated deck
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add decks/turtle-power.json

          if git diff --cached --quiet; then
            echo "No deck changes."
          else
            git commit -m "Update Archidekt decks"
            git push
          fi

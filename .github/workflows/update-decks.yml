#!/usr/bin/env python3
"""
Magic: The Gathering Commander Deck Retrieval
-----------------------------------------------

Retrieves the CURRENT deck directly from the synchronized
Archidekt -> GitHub mirror.

Primary source:
    SlickWhitaker/archidekt-decks/decks-slim/<DECK_ID>.cards.jsonl

Metadata:
    SlickWhitaker/archidekt-decks/decks-slim/<DECK_ID>.meta.json

Fallback:
    SlickWhitaker/archidekt-decks/decks-slim/<DECK_ID>.json

IMPORTANT:
    Do NOT search GitHub for the deck name.
    The Archidekt deck ID is the stable key.

Example:

    url = "https://archidekt.com/decks/25645732/cloud_equipment_buster"
    deck = get_current_deck(url)

    print(deck["name"])
    print(deck["commander"])
    print(deck["counts"])
"""

from __future__ import annotations

import json
import re
import urllib.error
import urllib.request
from dataclasses import dataclass
from typing import Any, Optional


# ============================================================
# CONFIGURATION
# ============================================================

GITHUB_OWNER = "SlickWhitaker"
GITHUB_REPO = "archidekt-decks"
GITHUB_BRANCH = "main"

DECKS_PATH = "decks-slim"

REQUEST_TIMEOUT = 20

USER_AGENT = (
    "Magic-the-Gathering-Analyzer/1.0 "
    "(Commander deck retrieval)"
)


# ============================================================
# DATA TYPES
# ============================================================

@dataclass
class DeckCard:
    name: str
    quantity: int
    board: str
    colors: list[str]
    color_identity: list[str]
    mana_value: Optional[float]
    card_type: str
    text: str

    @classmethod
    def from_dict(cls, data: dict[str, Any]) -> "DeckCard":
        return cls(
            name=str(data.get("name", "")),
            quantity=int(data.get("quantity", 1)),
            board=str(data.get("board", "main")),
            colors=list(data.get("colors") or []),
            color_identity=list(data.get("colorIdentity") or []),
            mana_value=data.get("manaValue"),
            card_type=str(data.get("type", "")),
            text=str(data.get("text", "")),
        )

    def to_dict(self) -> dict[str, Any]:
        return {
            "name": self.name,
            "quantity": self.quantity,
            "board": self.board,
            "colors": self.colors,
            "colorIdentity": self.color_identity,
            "manaValue": self.mana_value,
            "type": self.card_type,
            "text": self.text,
        }


# ============================================================
# URL / ID HANDLING
# ============================================================

def extract_archidekt_deck_id(url: str) -> str:
    """
    Extract the numeric Archidekt deck ID.

    Accepts URLs such as:

        https://archidekt.com/decks/25645732/cloud_equipment_buster

        https://archidekt.com/decks/25645732

        https://www.archidekt.com/decks/25645732/foo
    """

    if not isinstance(url, str):
        raise TypeError("Archidekt URL must be a string.")

    match = re.search(
        r"archidekt\.com/decks/(\d+)",
        url,
        flags=re.IGNORECASE,
    )

    if not match:
        raise ValueError(
            f"Could not extract an Archidekt deck ID from URL:\n{url}"
        )

    return match.group(1)


# ============================================================
# GITHUB ACCESS
# ============================================================

def github_api_url(path: str) -> str:
    """
    Build a GitHub Contents/API URL.
    """

    return (
        f"https://api.github.com/repos/"
        f"{GITHUB_OWNER}/{GITHUB_REPO}/contents/"
        f"{path}?ref={GITHUB_BRANCH}"
    )


def github_raw_url(path: str) -> str:
    """
    Build a GitHub raw URL.
    """

    return (
        f"https://raw.githubusercontent.com/"
        f"{GITHUB_OWNER}/{GITHUB_REPO}/"
        f"{GITHUB_BRANCH}/{path}"
    )


def http_get(
    url: str,
    *,
    accept: str = "application/vnd.github+json",
) -> str:
    """
    Perform a GET request.

    No GitHub search is performed.
    """

    request = urllib.request.Request(
        url,
        headers={
            "User-Agent": USER_AGENT,
            "Accept": accept,
        },
        method="GET",
    )

    try:
        with urllib.request.urlopen(
            request,
            timeout=REQUEST_TIMEOUT,
        ) as response:
            raw = response.read()

        return raw.decode("utf-8")

    except urllib.error.HTTPError as exc:
        raise RuntimeError(
            f"HTTP {exc.code} while retrieving:\n{url}"
        ) from exc

    except urllib.error.URLError as exc:
        raise RuntimeError(
            f"Network error while retrieving:\n{url}\n"
            f"{exc}"
        ) from exc


def github_get_file(path: str) -> str:
    """
    Retrieve a text file from the synchronized repository.

    First uses GitHub's contents API.

    Falls back to raw.githubusercontent.com if necessary.
    """

    api_url = github_api_url(path)

    try:
        response_text = http_get(api_url)

        payload = json.loads(response_text)

        # GitHub Contents API returns Base64 for normal files.
        if isinstance(payload, dict):
            encoded = payload.get("content")

            if encoded is not None:
                import base64

                return base64.b64decode(
                    encoded.replace("\n", "")
                ).decode("utf-8")

    except Exception:
        pass

    # Raw GitHub fallback.
    raw_url = github_raw_url(path)

    return http_get(
        raw_url,
        accept="text/plain",
    )


# ============================================================
# DECK RETRIEVAL
# ============================================================

def load_meta(deck_id: str) -> dict[str, Any]:
    """
    Retrieve deck metadata.

    This is deliberately separate from the card list so that
    commander/count validation doesn't depend on a giant response.
    """

    path = f"{DECKS_PATH}/{deck_id}.meta.json"

    content = github_get_file(path)

    try:
        data = json.loads(content)
    except json.JSONDecodeError as exc:
        raise RuntimeError(
            f"Invalid metadata JSON for deck {deck_id}."
        ) from exc

    if not isinstance(data, dict):
        raise RuntimeError(
            f"Metadata for deck {deck_id} is not an object."
        )

    return data


def load_cards_jsonl(deck_id: str) -> list[DeckCard]:
    """
    Retrieve the complete compact card list.

    One card per line means we don't need the enormous full deck
    JSON just to analyze the cards.
    """

    path = f"{DECKS_PATH}/{deck_id}.cards.jsonl"

    content = github_get_file(path)

    cards: list[DeckCard] = []

    for line_number, line in enumerate(
        content.splitlines(),
        start=1,
    ):
        line = line.strip()

        if not line:
            continue

        try:
            data = json.loads(line)
        except json.JSONDecodeError as exc:
            raise RuntimeError(
                f"Invalid JSON on line {line_number} "
                f"of deck {deck_id}."
            ) from exc

        card = DeckCard.from_dict(data)

        if not card.name:
            raise RuntimeError(
                f"Deck {deck_id} contains a card with "
                f"no name on line {line_number}."
            )

        cards.append(card)

    if not cards:
        raise RuntimeError(
            f"Deck {deck_id} returned zero cards."
        )

    return cards


def load_full_json_fallback(
    deck_id: str,
) -> tuple[dict[str, Any], list[DeckCard]]:
    """
    Fallback for older/incomplete compact mirrors.
    """

    path = f"{DECKS_PATH}/{deck_id}.json"

    content = github_get_file(path)

    try:
        data = json.loads(content)
    except json.JSONDecodeError as exc:
        raise RuntimeError(
            f"Invalid full deck JSON for {deck_id}."
        ) from exc

    if not isinstance(data, dict):
        raise RuntimeError(
            f"Full deck JSON for {deck_id} is not an object."
        )

    raw_cards = data.get("cards")

    if not isinstance(raw_cards, list):
        raise RuntimeError(
            f"Full deck JSON for {deck_id} contains no "
            f"usable cards list."
        )

    cards = [
        DeckCard.from_dict(card)
        for card in raw_cards
        if isinstance(card, dict)
    ]

    if not cards:
        raise RuntimeError(
            f"Full deck JSON for {deck_id} returned zero cards."
        )

    return data, cards


# ============================================================
# VALIDATION
# ============================================================

def calculate_counts(
    cards: list[DeckCard],
) -> dict[str, int]:
    """
    Calculate board counts from the actual card records.

    This is more trustworthy than assuming the metadata is correct.
    """

    counts = {
        "main": 0,
        "commander": 0,
        "maybeboard": 0,
        "sideboard": 0,
        "total": 0,
    }

    for card in cards:
        quantity = card.quantity

        if quantity < 1:
            raise RuntimeError(
                f"Invalid quantity for {card.name}: "
                f"{quantity}"
            )

        board = card.board

        if board not in counts:
            counts[board] = 0

        counts[board] += quantity
        counts["total"] += quantity

    return counts


def get_commanders(
    cards: list[DeckCard],
) -> list[DeckCard]:
    return [
        card
        for card in cards
        if card.board == "commander"
    ]


def get_main_deck(
    cards: list[DeckCard],
) -> list[DeckCard]:
    return [
        card
        for card in cards
        if card.board == "main"
    ]


def validate_deck(
    deck_id: str,
    metadata: dict[str, Any],
    cards: list[DeckCard],
) -> None:
    """
    Perform the minimum retrieval integrity checks before
    handing the deck to the analyzer.

    IMPORTANT:
        A deck being over/under 100 cards does NOT automatically
        make retrieval invalid. Archidekt can contain unfinished
        Commander decks.

    What matters here is that we retrieved the complete current
    representation rather than a truncated response.
    """

    if not cards:
        raise RuntimeError(
            f"Deck {deck_id}: no cards retrieved."
        )

    commanders = get_commanders(cards)
    main = get_main_deck(cards)

    if not commanders:
        raise RuntimeError(
            f"Deck {deck_id}: commander could not be identified."
        )

    calculated = calculate_counts(cards)

    metadata_counts = metadata.get("counts")

    if isinstance(metadata_counts, dict):
        expected_total = metadata_counts.get("total")

        if (
            expected_total is not None
            and int(expected_total) != calculated["total"]
        ):
            raise RuntimeError(
                "Deck retrieval integrity check failed.\n"
                f"Metadata total: {expected_total}\n"
                f"Retrieved total: {calculated['total']}\n"
                f"Deck ID: {deck_id}"
            )

    metadata_commanders = metadata.get("commander")

    if isinstance(metadata_commanders, list):
        actual_names = [
            card.name
            for card in commanders
        ]

        if metadata_commanders != actual_names:
            raise RuntimeError(
                "Commander verification failed.\n"
                f"Metadata: {metadata_commanders}\n"
                f"Retrieved: {actual_names}\n"
                f"Deck ID: {deck_id}"
            )

    # Check for duplicate non-basic cards.
    # We don't reject them because this can be useful when the
    # deck is unfinished, but the information is preserved.
    #
    # Commander legality is a separate analysis step.


# ============================================================
# PUBLIC API
# ============================================================

def get_current_deck(
    archidekt_url: str,
) -> dict[str, Any]:
    """
    Retrieve the current deck associated with an Archidekt URL.

    This is the MAIN FUNCTION the analyzer should call.

    Example:

        deck = get_current_deck(
            "https://archidekt.com/decks/25645732/cloud_equipment_buster"
        )

    Returns:

        {
            "id": "25645732",
            "name": "...",
            "commander": [...],
            "cards": [...],
            "main": [...],
            "counts": {...},
            "colorIdentity": [...]
        }
    """

    deck_id = extract_archidekt_deck_id(
        archidekt_url
    )

    # --------------------------------------------------------
    # 1. Retrieve metadata
    # --------------------------------------------------------

    metadata = load_meta(deck_id)

    # --------------------------------------------------------
    # 2. Retrieve compact complete card list
    # --------------------------------------------------------

    try:
        cards = load_cards_jsonl(deck_id)

    except Exception as compact_error:

        # ----------------------------------------------------
        # 3. Fallback to complete JSON
        # ----------------------------------------------------

        try:
            full_data, cards = load_full_json_fallback(
                deck_id
            )

            # Prefer metadata from the full file if available.
            if not metadata:
                metadata = full_data

        except Exception as full_error:

            raise RuntimeError(
                "CURRENT DECK COULD NOT BE RETRIEVED.\n\n"
                f"Deck URL:\n{archidekt_url}\n\n"
                f"Deck ID:\n{deck_id}\n\n"
                f"Compact source error:\n{compact_error}\n\n"
                f"Full JSON fallback error:\n{full_error}"
            ) from full_error

    # --------------------------------------------------------
    # 4. Validate that retrieval is complete
    # --------------------------------------------------------

    validate_deck(
        deck_id,
        metadata,
        cards,
    )

    commanders = get_commanders(cards)
    main = get_main_deck(cards)
    counts = calculate_counts(cards)

    # --------------------------------------------------------
    # 5. Build analyzer-friendly representation
    # --------------------------------------------------------

    return {
        "id": deck_id,

        "url": archidekt_url,

        "name": metadata.get(
            "name",
            f"Archidekt Deck {deck_id}",
        ),

        "format": metadata.get(
            "format"
        ),

        "commander": [
            card.to_dict()
            for card in commanders
        ],

        "main": [
            card.to_dict()
            for card in main
        ],

        "cards": [
            card.to_dict()
            for card in cards
        ],

        "counts": counts,

        "colorIdentity": metadata.get(
            "colorIdentity",
            sorted({
                color
                for card in commanders
                for color in card.color_identity
            }),
        ),

        "metadata": metadata,
    }


# ============================================================
# CARD LOOKUP HELPERS
# ============================================================

def deck_contains(
    deck: dict[str, Any],
    card_name: str,
) -> bool:
    """
    Check whether a card is already in the current deck.
    """

    target = card_name.strip().casefold()

    return any(
        card["name"].strip().casefold() == target
        for card in deck["cards"]
    )


def get_card(
    deck: dict[str, Any],
    card_name: str,
) -> Optional[dict[str, Any]]:
    """
    Retrieve one card from the current deck.
    """

    target = card_name.strip().casefold()

    for card in deck["cards"]:
        if card["name"].strip().casefold() == target:
            return card

    return None


def deck_card_names(
    deck: dict[str, Any],
) -> set[str]:
    """
    Return normalized names for fast membership checks.
    """

    return {
        card["name"].strip().casefold()
        for card in deck["cards"]
    }


# ============================================================
# SOURCE FILE SUPPORT
# ============================================================

def load_archidekt_urls(
    source_file: str,
) -> list[str]:
    """
    Read Archidekt URLs from the project's URL source file.

    Blank lines and comments are ignored.
    """

    urls: list[str] = []

    with open(
        source_file,
        "r",
        encoding="utf-8",
    ) as fh:

        for line in fh:
            line = line.strip()

            if not line:
                continue

            if line.startswith("#"):
                continue

            if "archidekt.com/decks/" in line.lower():
                urls.append(line)

    return urls


def find_deck_url(
    source_file: str,
    deck_id: str,
) -> Optional[str]:
    """
    Find a specific Archidekt deck URL by ID.
    """

    urls = load_archidekt_urls(source_file)

    for url in urls:

        try:
            current_id = extract_archidekt_deck_id(
                url
            )
        except ValueError:
            continue

        if current_id == str(deck_id):
            return url

    return None


# ============================================================
# ANALYZER ENTRY POINT
# ============================================================

def retrieve_deck_for_analysis(
    archidekt_url: str,
) -> dict[str, Any]:
    """
    Final entry point for the MTG analyzer.

    DO NOT give the analyzer a partial search result.

    The analyzer receives the complete retrieved deck or an
    explicit exception.
    """

    deck = get_current_deck(
        archidekt_url
    )

    # Final sanity check before analysis.
    if not deck["commander"]:
        raise RuntimeError(
            "Analyzer refused deck: commander missing."
        )

    if not deck["cards"]:
        raise RuntimeError(
            "Analyzer refused deck: card list missing."
        )

    if deck["counts"]["total"] <= 1:
        raise RuntimeError(
            "Analyzer refused deck: suspiciously incomplete "
            "card count."
        )

    return deck



name: Update Archidekt Decks

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-archidekt-decks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Synchronize with latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Create decks directory
        run: |
          mkdir -p decks decks-slim

      - name: Fetch Archidekt decks
        run: |
          decks=(
            "25646654"
            "25646635"
            "25646611"
            "25646583"
            "25646532"
            "25646499"
            "25646467"
            "25646416"
            "25646394"
            "25646098"
            "25646062"
            "25646033"
            "25645985"
            "25645947"
            "25645835"
            "25645732"
            "25645631"
            "25645591"
            "25645511"
          )

          failed=0

          for deck_id in "${decks[@]}"; do
            echo ""
            echo "========================================"
            echo "Fetching deck ${deck_id}"
            echo "========================================"

            tmp_file="decks/.${deck_id}.json.tmp"
            rm -f "$tmp_file"

            success=0

            for attempt in 1 2 3; do
              echo "Attempt ${attempt} for deck ${deck_id}"

              http_code=$(curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout 15 \
                --max-time 60 \
                --retry 2 \
                --retry-delay 2 \
                --output "$tmp_file" \
                --write-out "%{http_code}" \
                -H "Accept: application/json" \
                "https://archidekt.com/api/decks/${deck_id}/" || true)

              echo "HTTP status: ${http_code}"
              echo "Response size: $(wc -c < "$tmp_file" 2>/dev/null || echo 0) bytes"

              if [ "${http_code}" = "200" ] && jq empty "$tmp_file" >/dev/null 2>&1; then
                mv "$tmp_file" "decks/${deck_id}.json"
                echo "SUCCESS: Valid JSON for ${deck_id}"
                success=1
                break
              fi

              echo "WARNING: Deck ${deck_id} failed attempt ${attempt}; keeping the previous valid copy."
              sleep 2
            done

            rm -f "$tmp_file"

            if [ "$success" -ne 1 ]; then
              echo "WARNING: Could not refresh deck ${deck_id} after 3 attempts."
              failed=1
            fi
          done

          echo ""
          echo "========================================"
          echo "FETCH SUMMARY"
          echo "========================================"

          if [ "$failed" -ne 0 ]; then
            echo "WARNING: One or more decks could not be refreshed."
            echo "Existing valid deck files were preserved, so the repository remains usable."
          else
            echo "ALL DECKS SUCCESSFULLY FETCHED."
          fi

      - name: Build compact analysis decks
        run: |
          python3 scripts/build_slim_decks.py

      - name: Commit updated decks
        run: |
          git add decks/ decks-slim/ scripts/build_slim_decks.py

          if git diff --cached --quiet; then
            echo "No deck changes detected."
            exit 0
          fi

          git commit -m "Update Archidekt decks and analysis copies"

      - name: Push changes
        run: |
          for attempt in 1 2 3; do
            echo ""
            echo "========================================"
            echo "Push attempt ${attempt}"
            echo "========================================"

            if git push origin main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push was rejected. Synchronizing with origin/main..."

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase failed; resetting to origin/main and reapplying the deck update."
              git rebase --abort || true
              git reset --hard origin/main
              git add decks/ decks-slim/ scripts/build_slim_decks.py
              if ! git diff --cached --quiet; then
                git commit -m "Update Archidekt decks and analysis copies"
              fi
            fi
          done

          echo "ERROR: Could not push after 3 attempts."
          exit 1

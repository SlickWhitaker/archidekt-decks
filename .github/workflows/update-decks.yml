name: Update Archidekt Decks

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create decks directory
        run: mkdir -p decks

      - name: Fetch Turtle Power test deck
        run: |
          curl --fail --silent --show-error --location \
            -H "Accept: application/json" \
            -o decks/22618311.json \
            "https://archidekt.com/api/decks/22618311/"

          echo "Downloaded $(wc -c < decks/22618311.json) bytes"

          echo "First 500 characters:"
          head -c 500 decks/22618311.json

      - name: Verify JSON
        run: |
          jq empty decks/22618311.json
          echo "JSON is valid."

      - name: Commit updated deck
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add decks/22618311.json

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update Archidekt deck"
            git push
          fi
